name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: document_vault
          POSTGRES_PASSWORD: Vault#123
          POSTGRES_DB: document_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U document_vault -d document_vault"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://document_vault:Vault%23123@localhost:5432/document_vault

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run gendb

      - name: Apply database migrations
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test